name: Update Delhivery Token to Google Sheet

on:
  schedule:
    - cron: "0 0 * * *"    # every day at 00:00 UTC
    - cron: "0 12 * * *"   # every day at 12:00 UTC
  workflow_dispatch:        # still allow manual runs

jobs:
  update-token:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run token generator
        env:
          SELLISHIP_EMAIL: ${{ secrets.SELLISHIP_EMAIL }}
          SELLISHIP_PASSWORD: ${{ secrets.SELLISHIP_PASSWORD }}
          GSHEET_WEBAPP_URL: ${{ secrets.GSHEET_WEBAPP_URL }}
        run: python scripts/update_token.py
